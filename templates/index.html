<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UTSmartBot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
</head>
<body>
    <aside class="sidebar" id="sidebar">
        <div class="brand">
            <div class="logo">UTS</div>
            <div>
                <h1>UTSmartBot</h1>
                <p>Your UTS campus assistant</p>
            </div>
        </div>

        <button class="new-chat" id="new-chat" type="button">+ New chat</button>

        <section class="recent" id="recent" hidden>
            <div class="recent-head">
                <h2>Recent chats</h2>
                <button class="clear-chats" id="clear-chats" type="button">Clear all</button>
            </div>
            <ul class="chat-list" id="chat-list"></ul>
            <p class="recent-note">Saved in this browser only.</p>
        </section>

        <h2>Suggested questions</h2>
        <ul class="suggestions">
            <li><button type="button">What courses does UTS offer?</button></li>
            <li><button type="button">How much is the tuition fee for BCS?</button></li>
            <li><button type="button">What is the email of Dr. Alan Ting?</button></li>
            <li><button type="button">What are the entry requirements for the foundation programme?</button></li>
            <li><button type="button">What facilities are available on campus?</button></li>
        </ul>
    </aside>

    <main class="chat">
        <header class="chat-header">
            <button class="menu-btn" id="menu-btn" type="button" aria-label="Toggle suggestions">&#9776;</button>
            <span>UTSmartBot</span>
        </header>

        <div class="messages" id="messages" aria-live="polite"></div>

        <form class="composer" id="composer">
            <textarea id="user-input" rows="1" maxlength="2000"
                      placeholder="Ask anything about UTS..." aria-label="Message"></textarea>
            <button id="send-btn" type="submit" aria-label="Send">
                <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                    <path fill="currentColor" d="M2.01 21 23 12 2.01 3 2 10l15 2-15 2z"/>
                </svg>
            </button>
        </form>
        <p class="disclaimer">UTSmartBot can make mistakes. Check important details with UTS.</p>
    </main>

    <script>
        const CHATS_KEY = 'utsmartbot-chats';      // saved conversations, newest first
        const CURRENT_KEY = 'utsmartbot-current';  // the conversation that was open last
        const OLD_HISTORY_KEY = 'utsmartbot-history';  // single-conversation storage used before
        const MAX_CHATS = 30;
        const WELCOME = "Hello! I'm **UTSmartBot**, your friendly assistant for all things University of Technology Sarawak. How can I help you? :D";

        const messagesEl = document.getElementById('messages');
        const form = document.getElementById('composer');
        const input = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const sidebar = document.getElementById('sidebar');
        const recentEl = document.getElementById('recent');
        const chatListEl = document.getElementById('chat-list');

        // Conversations live only in this browser (localStorage); the server never stores them.
        // Storage can be blocked (private mode, strict settings): the chat then still works in memory.
        let chats = loadChats();
        let currentId = readStorage(localStorage, CURRENT_KEY);
        let history = (chats.find(c => c.id === currentId) || { messages: [] }).messages.slice();
        let busy = false;

        function readStorage(storage, key) {
            try { return storage.getItem(key); } catch { return null; }
        }

        function loadChats() {
            let saved = [];
            try { saved = JSON.parse(readStorage(localStorage, CHATS_KEY)) || []; } catch { saved = []; }
            // Bring over a conversation kept by the older, single-chat version of the page.
            try {
                const old = JSON.parse(readStorage(sessionStorage, OLD_HISTORY_KEY)) || [];
                if (old.length) {
                    const id = newId();
                    saved.unshift({ id, title: chatTitle(old), updated: Date.now(), messages: old });
                    // Save first; only forget the old copy once the new one is stored.
                    localStorage.setItem(CHATS_KEY, JSON.stringify(saved));
                    localStorage.setItem(CURRENT_KEY, id);
                    sessionStorage.removeItem(OLD_HISTORY_KEY);
                }
            } catch { /* nothing to migrate */ }
            return saved.filter(c => c && c.id && Array.isArray(c.messages));
        }

        function newId() {
            return `${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`;
        }

        function chatTitle(messages) {
            const first = (messages.find(m => m.role === 'user') || {}).text || 'New chat';
            const oneLine = first.replace(/\s+/g, ' ').trim();
            return oneLine.length > 48 ? `${oneLine.slice(0, 47)}…` : oneLine;
        }

        function writeChats() {
            // If the browser runs out of storage space, drop the oldest chats and try again.
            for (let keep = chats.length; keep >= 0; keep--) {
                try {
                    localStorage.setItem(CHATS_KEY, JSON.stringify(chats.slice(0, keep)));
                    chats = chats.slice(0, keep);
                    if (currentId) localStorage.setItem(CURRENT_KEY, currentId);
                    else localStorage.removeItem(CURRENT_KEY);
                    return;
                } catch { /* storage full or blocked */ }
            }
        }

        // Save the open conversation (empty ones are not kept) and refresh the list.
        function saveHistory() {
            if (history.length) {
                if (!currentId) currentId = newId();
                const chat = { id: currentId, title: chatTitle(history), updated: Date.now(), messages: history };
                chats = [chat, ...chats.filter(c => c.id !== currentId)].slice(0, MAX_CHATS);
            } else if (currentId) {
                // e.g. the first question of a new chat failed: don't keep an empty conversation
                chats = chats.filter(c => c.id !== currentId);
                currentId = null;
            }
            writeChats();
            renderChatList();
        }

        function formatWhen(time) {
            const date = new Date(time);
            const today = new Date();
            const yesterday = new Date(today.getFullYear(), today.getMonth(), today.getDate() - 1);
            if (date.toDateString() === today.toDateString()) {
                return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            }
            if (date.toDateString() === yesterday.toDateString()) return 'Yesterday';
            return date.toLocaleDateString([], { day: 'numeric', month: 'short' });
        }

        function renderChatList() {
            recentEl.hidden = chats.length === 0;
            chatListEl.innerHTML = '';
            for (const chat of chats) {
                const li = document.createElement('li');
                li.className = `chat-entry${chat.id === currentId ? ' active' : ''}`;
                const open = document.createElement('button');
                open.type = 'button';
                open.className = 'chat-open';
                open.title = chat.title;
                if (chat.id === currentId) open.setAttribute('aria-current', 'true');
                const title = document.createElement('span');
                title.className = 'chat-title';
                title.textContent = chat.title;
                const when = document.createElement('span');
                when.className = 'chat-when';
                when.textContent = formatWhen(chat.updated);
                open.append(title, when);
                open.addEventListener('click', () => openChat(chat.id));
                const remove = document.createElement('button');
                remove.type = 'button';
                remove.className = 'chat-delete';
                remove.setAttribute('aria-label', `Delete chat: ${chat.title}`);
                remove.textContent = '×';
                remove.addEventListener('click', () => deleteChat(chat.id));
                li.append(open, remove);
                chatListEl.appendChild(li);
            }
        }

        function openChat(id) {
            if (busy) return;
            const chat = chats.find(c => c.id === id);
            if (!chat) return;
            currentId = id;
            history = chat.messages.slice();
            writeChats();
            renderAll();
            renderChatList();
            sidebar.classList.remove('open');
            input.focus();
        }

        function startNewChat() {
            if (busy) return;
            currentId = null;  // the previous conversation is already saved in the list
            history = [];
            writeChats();
            renderAll();
            renderChatList();
            sidebar.classList.remove('open');
            input.focus();
        }

        function deleteChat(id) {
            if (busy) return;
            chats = chats.filter(c => c.id !== id);
            if (id === currentId) {
                startNewChat();
            } else {
                writeChats();
                renderChatList();
            }
        }

        function renderMarkdown(text) {
            return DOMPurify.sanitize(marked.parse(text), { ADD_ATTR: ['target'] });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        const CITATION_RE = /\[(\d+(?:\s*,\s*\d+)*)\](?!\()/g;

        function citedNumbers(text) {
            const numbers = new Set();
            for (const match of text.matchAll(CITATION_RE)) {
                match[1].split(',').forEach(n => numbers.add(Number(n)));
            }
            return numbers;
        }

        // Chips showing which exact-data tools the bot used, e.g. "Fee estimator · BCS · sarawakian".
        function renderTools(tools = [], pending = false) {
            if (!tools.length) return '';
            const chips = tools.map((t, i) => {
                const detail = Object.values(t.args || {})
                    .filter(v => typeof v !== 'object')
                    .map(v => String(v).replace(/_/g, ' '))
                    .join(' · ');
                const running = pending && i === tools.length - 1;
                return `<span class="tool-chip${running ? ' running' : ''}">${running ? 'Checking' : '✓'} ${escapeHtml(t.label)}` +
                    (detail ? `<small>${escapeHtml(detail)}</small>` : '') + '</span>';
            }).join('');
            return `<div class="tools">${chips}</div>`;
        }

        // Turn "[2]" / "[1, 3]" in the answer into small links to the sources.
        function renderAnswer(text, sources = [], tools = [], pending = false, meta = null) {
            const toolsHtml = renderTools(tools, pending);
            if (!text) return toolsHtml + '<span class="typing"><i></i><i></i><i></i></span>';
            // Which provider answered (the chat model can fall back between Gemini, Groq, OpenRouter, Ollama).
            const via = meta ? `<div class="answered-by">via ${escapeHtml(meta.provider)} · ${escapeHtml(meta.model)}</div>` : '';
            return toolsHtml + renderText(text, sources) + via;
        }

        function renderText(text, sources) {
            const byNumber = new Map(sources.map(s => [s.n, s]));
            const linked = text.replace(CITATION_RE, (whole, list) => {
                const parts = list.split(',').map(n => Number(n.trim()));
                if (!parts.every(n => byNumber.has(n))) return whole;
                return parts.map(n => {
                    const s = byNumber.get(n);
                    const label = `<sup class="cite" title="${escapeHtml(s.title)}">${n}</sup>`;
                    return s.url ? `<a href="${escapeHtml(s.url)}" target="_blank" rel="noopener">${label}</a>` : label;
                }).join('');
            });

            let html = renderMarkdown(linked);
            const cited = sources.filter(s => citedNumbers(text).has(s.n));
            if (cited.length) {
                const items = cited.map(s => {
                    const title = s.url
                        ? `<a href="${escapeHtml(s.url)}" target="_blank" rel="noopener">${escapeHtml(s.title)}</a>`
                        : escapeHtml(s.title);
                    return `<li><span class="source-n">${s.n}</span><div>${title}<p>${escapeHtml(s.snippet)}…</p></div></li>`;
                }).join('');
                html += DOMPurify.sanitize(
                    `<details class="sources"><summary>Sources (${cited.length})</summary><ol>${items}</ol></details>`,
                    { ADD_ATTR: ['target'] }
                );
            }
            return html;
        }

        function addMessage(role, text, sources, tools, meta) {
            const el = document.createElement('div');
            el.className = `message ${role === 'user' ? 'user' : 'bot'}`;
            const body = document.createElement('div');
            body.className = 'bubble';
            if (role === 'user') {
                body.textContent = text;
            } else {
                body.innerHTML = renderAnswer(text, sources, tools, false, meta);
            }
            el.appendChild(body);
            messagesEl.appendChild(el);
            scrollToBottom();
            return body;
        }

        function scrollToBottom() {
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function renderAll() {
            messagesEl.innerHTML = '';
            addMessage('model', WELCOME);
            history.forEach(turn => addMessage(turn.role, turn.text, turn.sources, turn.tools, turn.meta));
        }

        function setBusy(value) {
            busy = value;
            sendBtn.disabled = value;
        }

        async function ask(message) {
            if (busy || !message.trim()) return;
            setBusy(true);

            const priorHistory = history.slice();
            addMessage('user', message);
            history.push({ role: 'user', text: message });
            saveHistory();

            const bubble = addMessage('model', '');

            let answer = '';
            let sources = [];
            const tools = [];
            let meta = null;
            try {
                const response = await fetch('/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message, history: priorHistory.map(({ role, text }) => ({ role, text })) }),
                });

                if (!response.ok) {
                    const data = await response.json().catch(() => ({}));
                    const failure = new Error(data.error || `Request failed (${response.status})`);
                    // Limits and busy services have their own clear message from the server.
                    failure.explained = Boolean(data.error) && [429, 502].includes(response.status);
                    throw failure;
                }

                // The server streams one JSON event per line: sources, tool calls and text.
                const handle = event => {
                    if (event.type === 'sources') sources = event.sources;
                    else if (event.type === 'meta') meta = { provider: event.provider, model: event.model };
                    else if (event.type === 'tool') tools.push({ name: event.name, label: event.label, args: event.args });
                    else if (event.type === 'text') answer += event.text;
                };
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';
                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop();  // keep a partial line for the next read
                    lines.filter(line => line.trim()).forEach(line => handle(JSON.parse(line)));
                    bubble.innerHTML = renderAnswer(answer, sources, tools, !answer, meta);
                    scrollToBottom();
                }
                if (buffer.trim()) handle(JSON.parse(buffer));
                bubble.innerHTML = renderAnswer(answer, sources, tools, false, meta);
                if (!answer.trim()) throw new Error('Empty response');
                history.push({ role: 'model', text: answer, sources, tools, meta });
            } catch (error) {
                console.error('Error fetching response:', error);
                bubble.innerHTML = renderMarkdown(error.explained
                    ? error.message
                    : `Oops! Something went wrong. Please try again later.\n\n_${error.message}_`);
                bubble.parentElement.classList.add('error');
                // Drop the unanswered question so the next request has a clean history.
                history = priorHistory;
            } finally {
                saveHistory();
                setBusy(false);
                input.focus();
            }
        }

        form.addEventListener('submit', event => {
            event.preventDefault();
            const message = input.value;
            input.value = '';
            autoResize();
            ask(message);
        });

        // Enter sends, Shift+Enter adds a new line.
        input.addEventListener('keydown', event => {
            if (event.key === 'Enter' && !event.shiftKey && !event.isComposing) {
                event.preventDefault();
                form.requestSubmit();
            }
        });

        function autoResize() {
            input.style.height = 'auto';
            input.style.height = `${Math.min(input.scrollHeight, 160)}px`;
        }
        input.addEventListener('input', autoResize);

        document.querySelectorAll('.suggestions button').forEach(button => {
            button.addEventListener('click', () => {
                sidebar.classList.remove('open');
                ask(button.textContent);
            });
        });

        document.getElementById('new-chat').addEventListener('click', startNewChat);

        document.getElementById('clear-chats').addEventListener('click', () => {
            if (busy) return;
            chats = [];
            startNewChat();
        });

        document.getElementById('menu-btn').addEventListener('click', () => {
            sidebar.classList.toggle('open');
        });

        renderAll();
        renderChatList();
        input.focus();
    </script>
</body>
</html>
